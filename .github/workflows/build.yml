name: Build Layer
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          mkdir python
          pip install requests beautifulsoup4 lxml openai -t python/
      
      - name: Create ZIP
        run: zip -r layer.zip python/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: layer
          path: layer.zip
